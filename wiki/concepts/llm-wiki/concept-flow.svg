<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" role="img" aria-labelledby="title desc">
  <title id="title">Concept to project flow</title>
  <desc id="desc">A human concept is clarified by AI questions, then becomes project brief, architecture, decisions, contracts, tasks, test matrix, and implementation or repo migration.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
    <style>
      .box { rx: 10; ry: 10; stroke-width: 2; }
      .text { font: 16px Arial, sans-serif; fill: #111827; }
      .small { font: 13px Arial, sans-serif; fill: #374151; }
      .arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .back { stroke: #6b7280; stroke-width: 2; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .note { font: 14px Arial, sans-serif; fill: #4b5563; }
    </style>
  </defs>

  <rect x="30" y="35" width="1120" height="490" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="55" y="72" class="text" font-weight="700">Concept To Project/Repo Flow</text>
  <text x="55" y="96" class="note">Unknowns are clarified before project docs become executable tasks.</text>

  <rect class="box" x="60" y="180" width="145" height="72" fill="#f7f7f2" stroke="#4b5563"/>
  <text class="text" x="83" y="211">Human</text>
  <text class="text" x="82" y="233">concept</text>

  <polygon points="315,158 425,216 315,274 205,216" fill="#fff4cc" stroke="#8a6d1d" stroke-width="2"/>
  <text class="text" x="270" y="211">Unknowns</text>
  <text class="text" x="295" y="233">clear?</text>

  <rect class="box" x="245" y="345" width="160" height="72" fill="#f7f7f2" stroke="#4b5563"/>
  <text class="text" x="273" y="376">AI asks</text>
  <text class="small" x="270" y="399">targeted questions</text>

  <rect class="box" x="500" y="180" width="155" height="72" fill="#e8f3ff" stroke="#2463a6"/>
  <text class="text" x="538" y="211">Project</text>
  <text class="small" x="522" y="234">project_brief.md</text>

  <rect class="box" x="725" y="120" width="160" height="66" fill="#e8f3ff" stroke="#2463a6"/>
  <text class="text" x="759" y="150">Architecture</text>
  <text class="small" x="755" y="171">wiki/architecture.md</text>

  <rect class="box" x="725" y="215" width="160" height="66" fill="#e8f3ff" stroke="#2463a6"/>
  <text class="text" x="763" y="245">Decisions</text>
  <text class="small" x="759" y="266">docs/decisions.md</text>

  <rect class="box" x="725" y="310" width="160" height="66" fill="#e8f3ff" stroke="#2463a6"/>
  <text class="text" x="764" y="340">Contracts</text>
  <text class="small" x="760" y="361">docs/contracts.md</text>

  <rect class="box" x="955" y="155" width="155" height="72" fill="#e9f7ef" stroke="#2f7d4a"/>
  <text class="text" x="999" y="186">Tasks</text>
  <text class="small" x="990" y="209">docs/tasks.md</text>

  <rect class="box" x="955" y="275" width="155" height="72" fill="#e9f7ef" stroke="#2f7d4a"/>
  <text class="text" x="991" y="306">Test matrix</text>
  <text class="small" x="977" y="329">docs/test_matrix.md</text>

  <rect class="box" x="725" y="430" width="160" height="58" fill="#f3e8ff" stroke="#7e3fb2"/>
  <text class="text" x="750" y="465">Implementation</text>

  <rect class="box" x="955" y="430" width="155" height="58" fill="#f3e8ff" stroke="#7e3fb2"/>
  <text class="text" x="985" y="454">Repo migration</text>
  <text class="small" x="982" y="475">or project link note</text>

  <path class="arrow" d="M205 216 H205"/>
  <path class="arrow" d="M425 216 H500"/>
  <path class="back" d="M315 274 V345"/>
  <path class="back" d="M245 381 C155 380 132 305 132 252"/>
  <path class="arrow" d="M655 216 C690 193 702 160 725 153"/>
  <path class="arrow" d="M805 186 V215"/>
  <path class="arrow" d="M805 281 V310"/>
  <path class="arrow" d="M885 343 C925 315 937 285 955 311"/>
  <path class="arrow" d="M885 153 C925 164 937 181 955 191"/>
  <path class="arrow" d="M1032 227 V275"/>
  <path class="arrow" d="M1032 347 C1032 385 925 425 885 459"/>
  <path class="arrow" d="M885 459 H955"/>

  <text class="small" x="442" y="202">yes</text>
  <text class="small" x="334" y="316">no</text>
</svg>
